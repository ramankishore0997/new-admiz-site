[build]
  command = "pnpm --filter @workspace/razr-agency run build"
  publish = "artifacts/razr-agency/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_FLAGS = "--no-frozen-lockfile"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
